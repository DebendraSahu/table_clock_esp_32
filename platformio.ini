; --------------------------------------------------------------------
; Table Clock
; ESP32-DevKitM-1 + 3.5" ILI9488 (480x320) + XPT2046 touch
; --------------------------------------------------------------------
; The entire TFT_eSPI hardware configuration lives here rather than in
; the library's User_Setup.h. That file sits under .pio/ which is
; gitignored, so config placed there is silently lost on a clean
; checkout or `pio run -t clean`. USER_SETUP_LOADED=1 makes TFT_eSPI
; skip User_Setup.h entirely and use these flags instead.
;
; Environments:
;   esp32dev    - the clock firmware (default)
;   touch-test  - standalone XPT2046 diagnostic, see tools/touch_test/
;
; https://docs.platformio.org/page/projectconf.html
; --------------------------------------------------------------------

[platformio]
default_envs = esp32dev

; --------------------------------------------------------------------
; Shared hardware definition
; --------------------------------------------------------------------
[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

lib_deps =
	bodmer/TFT_eSPI@^2.5.43
	bblanchon/ArduinoJson@^7.4.2

build_flags =
	; ---- take over TFT_eSPI configuration ----
	-DUSER_SETUP_LOADED=1

	; ---- display driver ----
	-DILI9488_DRIVER=1

	; ---- SPI pins, display ----
	-DTFT_MOSI=23
	-DTFT_SCLK=18
	-DTFT_CS=15
	-DTFT_DC=2
	-DTFT_RST=4
	; MISO is REQUIRED. Left undefined, TFT_eSPI defaults it to -1, the
	; SPI bus is configured read-disabled, and touch silently returns
	; nothing however well the panel is wired.
	-DTFT_MISO=19

	; ---- XPT2046 touch, same SPI bus ----
	; Without TOUCH_CS the whole touch extension is compiled out and
	; tft.getTouch() does not exist as a symbol.
	-DTOUCH_CS=22

	; ---- bus speeds ----
	; 27 MHz is the stable ILI9488 value over jumper wires. At 40 MHz the
	; shared SCK/MOSI lines ring enough to corrupt the touch ADC reads,
	; which shows up as touches that register only intermittently.
	-DSPI_FREQUENCY=27000000
	-DSPI_READ_FREQUENCY=20000000
	; The XPT2046 sample-and-hold needs settling time and touch is not
	; speed-critical. 2.5 MHz (the library default) is marginal.
	-DSPI_TOUCH_FREQUENCY=1000000

	; ---- fonts ----
	; GFXFF supplies the proportional UI text. SMOOTH_FONT enables VLW
	; rendering, which carries 8-bit coverage per pixel and gives the big
	; clock digits genuinely anti-aliased edges.
	; The bitmap fonts (LOAD_FONT2/4/6/7/8) are deliberately NOT loaded -
	; nothing calls setTextFont(). GLCD stays as a safety net so any
	; stray drawString() before a font is selected still renders.
	-DLOAD_GLCD=1
	-DLOAD_GFXFF=1
	-DSMOOTH_FONT=1

	; ---- misc ----
	-DSUPPORT_TRANSACTIONS

; --------------------------------------------------------------------
; The clock firmware
; --------------------------------------------------------------------
[env:esp32dev]
build_src_filter = +<*> -<../tools/>

; --------------------------------------------------------------------
; XPT2046 diagnostic
; --------------------------------------------------------------------
; Build and flash with:  pio run -e touch-test -t upload -t monitor
;
; Reports raw pressure and coordinates over serial and draws a dot under
; your finger. Everything it draws is blocks, lines and circles, so it
; works even if the font configuration is broken.
; --------------------------------------------------------------------
[env:touch-test]
build_src_filter = -<*> +<../tools/touch_test/>
